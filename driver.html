<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مشاويري | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-primary"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none form-page">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-1">
      <button type="button" class="btn btn-outline-secondary btn-sm" id="prev-day" aria-label="اليوم اللي فات">
        <i class="bi bi-chevron-right"></i>
      </button>
      <div class="text-center">
        <h1 class="h5 fw-bold mb-0" id="driver-title">مشاوير النهارده</h1>
        <div class="small text-muted" id="driver-date"></div>
      </div>
      <button type="button" class="btn btn-outline-secondary btn-sm" id="next-day" aria-label="اليوم الجاي">
        <i class="bi bi-chevron-left"></i>
      </button>
    </div>
    <div class="text-center mb-3">
      <button type="button" class="btn btn-link btn-sm d-none" id="go-today">ارجع للنهارده</button>
    </div>

    <div id="driver-alert" class="mb-3 d-none"></div>
    <div class="d-grid gap-3" id="driver-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/driver.js"></script>
</body>
</html>

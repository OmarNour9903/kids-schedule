<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131B2B">
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مواعيد الأولاد">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>مشاويري | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-primary"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none form-page">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-1" id="day-nav">
      <button type="button" class="btn btn-outline-secondary btn-sm" id="prev-day" aria-label="اليوم اللي فات">
        <i class="bi bi-chevron-right"></i>
      </button>
      <div class="text-center">
        <h1 class="h5 fw-bold mb-0" id="driver-title">مشاوير النهارده</h1>
        <div class="small text-muted" id="driver-date"></div>
      </div>
      <button type="button" class="btn btn-outline-secondary btn-sm" id="next-day" aria-label="اليوم الجاي">
        <i class="bi bi-chevron-left"></i>
      </button>
    </div>
    <div class="text-center mb-2">
      <button type="button" class="btn btn-link btn-sm d-none" id="go-today">ارجع للنهارده</button>
    </div>

    <div class="d-grid gap-2 mb-3" id="driver-filters">
      <select class="form-select form-select-sm d-none" id="family-filter" aria-label="الأسرة"></select>
      <div class="btn-group w-100" role="group" aria-label="الفترة">
        <input type="radio" class="btn-check" name="range" id="range-upcoming" value="upcoming" autocomplete="off">
        <label class="btn btn-outline-primary btn-sm" for="range-upcoming">الجاية</label>
        <input type="radio" class="btn-check" name="range" id="range-day" value="day" autocomplete="off">
        <label class="btn btn-outline-primary btn-sm" for="range-day">يوم</label>
        <input type="radio" class="btn-check" name="range" id="range-week" value="week" autocomplete="off">
        <label class="btn btn-outline-primary btn-sm" for="range-week">الأسبوع</label>
        <input type="radio" class="btn-check" name="range" id="range-past" value="past" autocomplete="off">
        <label class="btn btn-outline-primary btn-sm" for="range-past">اللي فاتت</label>
      </div>
      <select class="form-select form-select-sm" id="status-filter" aria-label="الحالة">
        <option value="all">كل الحالات</option>
        <option value="pending">محتاجة تأكيد</option>
        <option value="confirmed">متأكدة</option>
        <option value="declined">اعتذرت عنها</option>
      </select>
    </div>

    <section class="card shadow-sm mb-3 ring-card" aria-labelledby="ring-title">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2 mb-2">
          <h2 class="h5 fw-semibold mb-0" id="ring-title">مين مشغول إمتى</h2>
          <span class="small text-muted" id="ring-date"></span>
        </div>
        <div id="day-ring"></div>
      </div>
    </section>

    <div id="driver-alert" class="mb-3 d-none"></div>
    <div class="d-grid gap-3" id="driver-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/driver.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الأولاد | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-primary"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none">
    <h1 class="h4 fw-bold mb-4">الأولاد</h1>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 fw-semibold" id="child-form-title">إضافة ولد</h2>
        <form id="child-form" class="row g-2" novalidate>
          <div class="col-md-4">
            <label for="child-name" class="form-label">الاسم</label>
            <input type="text" id="child-name" name="name" class="form-control" maxlength="40" required>
            <div class="invalid-feedback">اكتب الاسم</div>
          </div>
          <div class="col-md-3">
            <label for="child-birth-year" class="form-label">سنة الميلاد <span class="text-muted small">(اختياري)</span></label>
            <input type="number" id="child-birth-year" name="birthYear" class="form-control" min="2000" max="2030" dir="ltr">
            <div class="invalid-feedback">سنة غير صحيحة</div>
          </div>
          <div class="col-md-5">
            <label for="child-notes" class="form-label">ملاحظات <span class="text-muted small">(اختياري)</span></label>
            <input type="text" id="child-notes" name="notes" class="form-control" maxlength="200" placeholder="مثلاً: المدرسة، الفصل">
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="child-submit">إضافة</button>
            <button type="button" class="btn btn-outline-secondary d-none" id="child-cancel-edit">إلغاء التعديل</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-body">
        <div id="children-alert" class="mb-3 d-none"></div>
        <ul id="children-list" class="list-group"></ul>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/children.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفاصيل عيلة | لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-dark"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none">
    <a href="admin.html" class="small"><i class="bi bi-arrow-right"></i> رجوع للوحة التحكم</a>
    <div id="family-alert" class="my-3 d-none"></div>

    <div id="family-body">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2 mb-4">
        <h1 class="h4 fw-bold mb-0" id="family-name"></h1>
        <span id="family-status"></span>
      </div>

      <div class="row g-3 mb-4" id="family-stats"></div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 fw-semibold mb-3">الأعضاء</h2>
          <ul class="list-group" id="family-members"></ul>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 fw-semibold">استعادة البيانات</h2>
          <p class="small text-muted">الحاجات اللي اتمسحت أو اتلغت في العيلة دي. "استعادة" بترجّعها زي ما كانت.</p>
          <div class="d-grid gap-3" id="restore-sections"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/admin-family.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="container auth-wrapper">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-calendar-week auth-logo"></i>
          <h1 class="h4 fw-bold mt-2">مواعيد الأولاد</h1>
          <p class="text-muted mb-0">سجّل دخولك عشان تتابع المواعيد</p>
        </div>

        <div id="login-alert" class="mb-3 d-none"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">الإيميل</label>
            <input type="email" class="form-control" id="email" name="email" dir="ltr" autocomplete="email" required>
            <div class="invalid-feedback">اكتب إيميل صحيح</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">الباسورد</label>
            <input type="password" class="form-control" id="password" name="password" dir="ltr" autocomplete="current-password" required>
            <div class="invalid-feedback">اكتب الباسورد</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit">دخول</button>
          <button type="button" class="btn btn-link btn-sm w-100 mt-2" id="reset-password">نسيت الباسورد</button>
        </form>

        <hr>
        <p class="small text-muted text-center mb-0">
          مش عندك حساب؟ استخدم لينك الدعوة اللي وصلك من ولي الأمر،
          أو <a href="signup.html">اعمل عيلة جديدة</a>.
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>

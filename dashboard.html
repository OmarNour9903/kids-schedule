<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الرئيسية | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-primary"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h1 class="h4 fw-bold mb-1">أهلاً، <span id="welcome-name"></span></h1>
        <p class="text-muted mb-0">دورك في العيلة: <span id="welcome-role" class="fw-semibold"></span></p>
      </div>
    </div>

    <div class="card shadow-sm" data-show-for="owner parent viewer">
      <div class="card-body text-center py-5">
        <i class="bi bi-calendar3 placeholder-icon"></i>
        <h2 class="h5 mt-3">التقويم والمواعيد</h2>
        <p class="text-muted mb-0">هتظهر هنا في المرحلة الجاية إن شاء الله.</p>
      </div>
    </div>

    <div class="card shadow-sm d-none" data-show-for="driver">
      <div class="card-body text-center py-5">
        <i class="bi bi-car-front placeholder-icon"></i>
        <h2 class="h5 mt-3">مواعيد النهارده</h2>
        <p class="text-muted mb-0">مشاويرك هتظهر هنا في المرحلة الجاية إن شاء الله.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>

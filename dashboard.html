<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التقويم | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-primary"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none">
    <div id="calendar-alert" class="mb-3 d-none"></div>

    <div id="setup-hint" class="alert alert-info d-none" role="alert"></div>

    <div class="row g-4">
      <section class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="prev-month" aria-label="الشهر اللي فات">
                <i class="bi bi-chevron-right"></i>
              </button>
              <div class="text-center">
                <h1 class="h5 fw-bold mb-0" id="month-title"></h1>
                <button type="button" class="btn btn-link btn-sm p-0" id="go-today">النهارده</button>
              </div>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="next-month" aria-label="الشهر الجاي">
                <i class="bi bi-chevron-left"></i>
              </button>
            </div>
            <div class="calendar-grid calendar-head" id="calendar-head"></div>
            <div class="calendar-grid" id="calendar-days"></div>
          </div>
        </div>
      </section>

      <section class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
              <h2 class="h5 fw-semibold mb-0" id="day-title"></h2>
              <a class="btn btn-primary btn-sm d-none" id="add-appointment" href="appointment-form.html">
                <i class="bi bi-plus-lg"></i> موعد جديد
              </a>
            </div>
            <ul class="list-group" id="day-list"></ul>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حساب جديد | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="container auth-wrapper">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus auth-logo"></i>
          <h1 class="h4 fw-bold mt-2">حساب جديد</h1>
          <p class="text-muted mb-0" id="signup-intro"></p>
        </div>

        <div id="signup-alert" class="mb-3 d-none"></div>

        <form id="signup-form" class="d-none" novalidate>
          <div class="mb-3 d-none" id="family-name-field">
            <label for="familyName" class="form-label">اسم العيلة</label>
            <input type="text" class="form-control" id="familyName" name="familyName" maxlength="60" placeholder="مثلاً: عيلة دكتور وائل">
            <div class="invalid-feedback">اكتب اسم العيلة</div>
          </div>
          <div class="mb-3">
            <label for="name" class="form-label">اسمك</label>
            <input type="text" class="form-control" id="name" name="name" maxlength="60" autocomplete="name" required>
            <div class="invalid-feedback">اكتب اسمك</div>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">رقم الموبايل</label>
            <input type="tel" class="form-control" id="phone" name="phone" dir="ltr" pattern="[0-9+ ]{10,15}" autocomplete="tel" required>
            <div class="invalid-feedback">اكتب رقم موبايل صحيح</div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">الإيميل</label>
            <input type="email" class="form-control" id="email" name="email" dir="ltr" autocomplete="email" required>
            <div class="invalid-feedback">اكتب إيميل صحيح</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">الباسورد</label>
            <input type="password" class="form-control" id="password" name="password" dir="ltr" minlength="6" autocomplete="new-password" required>
            <div class="invalid-feedback">الباسورد لازم يكون 6 حروف على الأقل</div>
          </div>
          <div class="mb-3">
            <label for="passwordConfirm" class="form-label">أكّد الباسورد</label>
            <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" dir="ltr" autocomplete="new-password" required>
            <div class="invalid-feedback">الباسورد مش متطابق</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="signup-submit">إنشاء الحساب</button>
        </form>

        <hr>
        <p class="small text-muted text-center mb-0">عندك حساب؟ <a href="index.html">سجّل دخول</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/signup.js"></script>
</body>
</html>

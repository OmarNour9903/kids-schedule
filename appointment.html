<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفاصيل الموعد | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-primary"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none form-page">
    <a href="dashboard.html" class="small" id="back-link"><i class="bi bi-arrow-right"></i> رجوع للتقويم</a>

    <div id="details-alert" class="my-3 d-none"></div>

    <div id="details" class="card shadow-sm mt-2 d-none">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
          <div>
            <h1 class="h4 fw-bold mb-1" id="details-children"></h1>
            <div class="text-muted" id="details-day"></div>
          </div>
          <div class="d-flex flex-wrap gap-1" id="details-badges"></div>
        </div>

        <dl class="row mb-3" id="details-list"></dl>

        <div class="details-map mb-3" id="details-map"></div>

        <div class="d-flex flex-wrap gap-2 d-none" id="details-actions">
          <button type="button" class="btn btn-primary" id="edit-btn"><i class="bi bi-pencil"></i> تعديل</button>
          <button type="button" class="btn btn-outline-danger" id="cancel-btn"><i class="bi bi-x-circle"></i> إلغاء</button>
          <button type="button" class="btn btn-outline-success d-none" id="restore-btn"><i class="bi bi-arrow-counterclockwise"></i> رجّع الموعد</button>
        </div>
      </div>
    </div>

    <section id="status-card" class="card shadow-sm mt-3 d-none">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <h2 class="h6 fw-semibold mb-0">حالة المشوار</h2>
          <span class="badge" id="status-badge"></span>
        </div>
        <div class="alert alert-danger py-2 d-none" id="decline-box"></div>
        <div class="d-flex flex-wrap gap-2 mb-2" id="driver-buttons"></div>
        <button type="button" class="btn btn-sm btn-outline-primary d-none mb-2" id="assign-btn">
          <i class="bi bi-person-gear"></i> تعيين سواق للموعد ده
        </button>
        <ol class="status-log small text-muted mb-0" id="status-log"></ol>
      </div>
    </section>

    <section id="comments-card" class="card shadow-sm mt-3 d-none">
      <div class="card-body">
        <h2 class="h6 fw-semibold">التعليقات</h2>
        <ul class="list-unstyled d-grid gap-2 mb-3" id="comments-list"></ul>
        <form id="comment-form" class="d-flex gap-2" novalidate>
          <label for="comment-text" class="visually-hidden">تعليق</label>
          <input type="text" class="form-control" id="comment-text" maxlength="500" placeholder="اكتب تعليق على الموعد ده..." required>
          <button type="submit" class="btn btn-primary" id="comment-submit">إرسال</button>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/pages/appointment.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم | مواعيد الأولاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="app-nav" class="navbar navbar-expand-md navbar-dark bg-dark"></nav>

  <div id="page-loader" class="page-loader">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل</span></div>
  </div>

  <main id="page-content" class="container py-4 d-none">
    <div id="admin-alert" class="mb-3 d-none"></div>
    <div id="admin-body">
      <div class="row g-3 mb-4" id="admin-stats"></div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 fw-semibold mb-3">العائلات</h2>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr><th>العيلة</th><th>المالك</th><th>الأعضاء</th><th>المواعيد</th><th>اتعملت</th><th>الحالة</th><th></th></tr>
              </thead>
              <tbody id="families-table"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 fw-semibold mb-0">المستخدمين</h2>
            <label class="visually-hidden" for="users-search">بحث</label>
            <input type="search" class="form-control form-control-sm admin-search" id="users-search" placeholder="بحث بالاسم أو الإيميل أو الموبايل">
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr><th>الاسم</th><th>الإيميل والموبايل</th><th>العيلة والدور</th><th>اتسجل</th><th>الحالة</th><th></th></tr>
              </thead>
              <tbody id="users-table"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
